name: Publish diagnostics

# Temporary: find out why `vsce publish` hangs for 180s on /_apis/gallery.
# Read-only probes of the Marketplace from a runner. Prints HTTP status codes
# and timings only — never the token, which is sent with curl's -u from an env
# var and masked by Actions in any case.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Public gallery API, no auth (control - expect a fast 200)
        run: |
          curl -sS -o /dev/null -m 45 \
            -w 'public extensionquery: http %{http_code} in %{time_total}s\n' \
            -H 'Accept: application/json;api-version=3.0-preview.1' \
            -H 'Content-Type: application/json' \
            -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"oceanum.oceanum"}]}],"flags":914}' \
            || echo "public extensionquery: curl exit $?"

      - name: Gallery publisher, no auth (expect a fast 401, not a hang)
        run: |
          curl -sS -o /dev/null -m 45 \
            -w 'unauthenticated publisher GET: http %{http_code} in %{time_total}s\n' \
            -H 'Accept: application/json;api-version=3.0-preview.1' \
            https://marketplace.visualstudio.com/_apis/gallery/publishers/oceanum \
            || echo "unauthenticated publisher GET: curl exit $?"

      - name: Gallery publisher, with VSCE_PAT (the call vsce hangs on)
        env:
          PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "VSCE_PAT is empty in this repository"
            exit 0
          fi
          echo "VSCE_PAT length: ${#PAT}"
          curl -sS -o /dev/null -m 45 -u ":$PAT" \
            -w 'authenticated publisher GET: http %{http_code} in %{time_total}s\n' \
            -H 'Accept: application/json;api-version=3.0-preview.1' \
            https://marketplace.visualstudio.com/_apis/gallery/publishers/oceanum \
            || echo "authenticated publisher GET: curl exit $?"

      - name: Azure DevOps profile, with VSCE_PAT (is the token itself valid?)
        env:
          PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            exit 0
          fi
          curl -sS -o /dev/null -m 45 -u ":$PAT" \
            -w 'profile GET: http %{http_code} in %{time_total}s\n' \
            'https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1' \
            || echo "profile GET: curl exit $?"
