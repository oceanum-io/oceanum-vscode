name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      pre_release:
        description: 'Publish as pre-release'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run vscode:prepublish

      # Publishing with a token the Marketplace does not accept for this
      # publisher does not fail: the gallery call hangs for 180s and vsce
      # reports a timeout, four times over. verify-pat asks the one question
      # that matters and answers in a second, with the real reason (for a token
      # the Marketplace treats as anonymous: "TF400813: The user
      # 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa' is not authorized to access this
      # resource").
      - name: Verify the token can manage the publisher
        run: npx @vscode/vsce@3.9.2 verify-pat oceanum
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # The Marketplace's gallery call hangs often enough to block a release:
      # it returns nothing for 180s, typed-rest-client gives up ("Request
      # timeout: /_apis/gallery"), and vsce does not retry the publish
      # (microsoft/vscode-vsce#926). So retry it here. --skip-duplicate makes
      # a retry safe if an earlier attempt landed after its client gave up:
      # vsce then reports the version exists and exits 0.
      #
      # vsce is pinned for a reproducible release. 3.9.x published 0.2.0; 4.0.0
      # needs Node >= 22. Bump deliberately, with a publish to prove it.
      - name: Publish to VS Code Marketplace
        run: |
          if [ "${{ inputs.pre_release }}" = "true" ]; then
            set -- publish --pre-release --skip-duplicate
          else
            set -- publish --skip-duplicate
          fi
          for attempt in 1 2 3 4; do
            echo "::group::vsce attempt $attempt"
            if npx @vscode/vsce@3.9.2 "$@"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            sleep $((attempt * 30))
          done
          echo "::error::vsce publish failed on every attempt"
          exit 1
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # The publish above can exit 0 without the version being live, so say
      # plainly whether the Marketplace serves it. Read-only and unauthenticated.
      - name: Verify the Marketplace serves this version
        run: |
          version=$(node -p "require('./package.json').version")
          # The Marketplace validates a new version before it serves it, which vsce
          # itself calls "a few minutes". Six tries over three minutes called 0.6.0
          # missing when it appeared about seven minutes after publishing, so the
          # release run went red over a release that had worked. Twenty tries is ten
          # minutes, and the step still says plainly when the version never arrives.
          for attempt in $(seq 1 20); do
            if npx @vscode/vsce@3.9.2 show oceanum.oceanum --json |
              node -e "
                let raw = '';
                process.stdin.on('data', (d) => (raw += d));
                process.stdin.on('end', () => {
                  const listed = JSON.parse(raw).versions.map((v) => v.version);
                  console.log('listed:', listed.slice(0, 3).join(', '));
                  process.exit(listed.includes(process.argv[1]) ? 0 : 1);
                });
              " "$version"; then
              echo "Marketplace serves $version"
              exit 0
            fi
            sleep 30
          done
          echo "::error::$version is not on the Marketplace"
          exit 1

      # Another registry, reached from the build already made here, so how long the
      # Marketplace took to serve the version has no bearing on it. Without this it is
      # skipped whenever the step above gives up, which is how 0.6.0 reached the
      # Marketplace and nowhere else.
      - name: Publish to Open VSX Registry
        if: ${{ !cancelled() }}
        run: npx ovsx publish --pat ${{ secrets.OVSX_PAT }}
        continue-on-error: true  # Don't fail the workflow if Open VSX publish fails
