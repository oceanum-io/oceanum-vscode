name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      pre_release:
        description: 'Publish as pre-release'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run vscode:prepublish

      # vsce is pinned: unpinned, `npx` took 4.0.0 the day it was released and
      # every publish hung for 180s on the Marketplace handshake ("Request
      # timeout: /_apis/gallery"). 4.0.0 requires Node >= 22 and rewrote the
      # upload; 3.9.x is the line that published 0.2.0. Bump it deliberately,
      # with a publish to prove it.
      - name: Publish to VS Code Marketplace
        run: |
          if [ "${{ inputs.pre_release }}" = "true" ]; then
            npx @vscode/vsce@3.9.2 publish --pre-release
          else
            npx @vscode/vsce@3.9.2 publish
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        run: npx ovsx publish --pat ${{ secrets.OVSX_PAT }}
        continue-on-error: true  # Don't fail the workflow if Open VSX publish fails
